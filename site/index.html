<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${page_title}</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 16px;
      line-height: 1.6;
      color: #1f2328;
      background: #f6f8fa;
    }
    .card {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      padding: 24px 28px;
    }
    h1 { margin-top: 0; color: #5c3bce; }
    code { background: #eef1f4; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>${page_title}</h1>
    <p>This page was deployed with <strong>Terraform</strong>, not by hand.</p>
    <p>
      Terraform created this GitHub repository, uploaded this HTML file,
      and turned on GitHub Pages. The title above comes from the
      <code>page_title</code> variable.
    </p>
    <p>Built for my "Growing a Competency" assignment.</p>
  </div>
</body>
</html>
